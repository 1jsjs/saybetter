<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SayBetter</title>
  <meta name="description" content="Your English, coached from the conversations Bee heard today.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('sb-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#today" aria-label="SayBetter, today">
        <span class="brand__say">Say</span><span class="brand__better">Better</span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a class="nav__link" href="#today" data-route="today">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 10h7M8.5 14h7M8.5 18h4"/></svg>
          <span>Today</span>
        </a>
        <a class="nav__link" href="#practice" data-route="practice">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <span>Practice</span>
        </a>
        <a class="nav__link" href="#patterns" data-route="patterns">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/></svg>
          <span>Patterns</span>
        </a>
        <a class="nav__link" href="#drills" data-route="drills">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="6.5" y="6" width="11" height="12" rx="3"/><path d="M9 6l.7-3h4.6l.7 3M9 18l.7 3h4.6l.7-3M12 9.5V12l1.6 1"/></svg>
          <span>Wrist drills</span>
        </a>
      </nav>
      <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch to dark theme">
        <svg class="i-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg>
        <svg class="i-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <p class="loading" aria-live="polite">Loading your notebook…</p>
  </main>

  <footer class="footer">
    <p>SayBetter reads only your own conversations from Bee and runs on this computer.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
