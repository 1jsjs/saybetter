name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Offline end-to-end (recorded Bee stream, deterministic coach)
        run: SAYBETTER_LLM=fake SAYBETTER_HOME=$RUNNER_TEMP/sb node bin/saybetter.js watch --dry-run --input fixtures/stream-sample.jsonl --window 1
